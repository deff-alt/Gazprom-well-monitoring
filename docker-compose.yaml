services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: well
      POSTGRES_PASSWORD: wellpass
      POSTGRES_DB: wellmonitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U well -d wellmonitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://well:wellpass@db:5432/wellmonitor
      JWT_SECRET: change-me-to-long-random-string
      JWT_ACCESS_EXPIRES_MIN: 15
      JWT_REFRESH_EXPIRES_DAYS: 7
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata: