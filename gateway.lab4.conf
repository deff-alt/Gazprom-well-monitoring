server {
    listen 80;

    # --- Публичные эндпоинты реестра скважин ---
    location /api/v1/wells {
        proxy_pass http://well-registry:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/localities {
        proxy_pass http://well-registry:8000;
    }
    location /api/v1/promysels {
        proxy_pass http://well-registry:8000;
    }

    # --- Публичные эндпоинты телеметрии ---
    location /api/v1/telemetry {
        proxy_pass http://telemetry:8000;
    }

    # --- Публичные эндпоинты ML ---
    location /api/v1/predict {
        proxy_pass http://ml-diagnostics:8000;
    }

    # --- Публичные эндпоинты алертов ---
    location /api/v1/alerts {
        proxy_pass http://alert:8000;
    }

    # --- Healthcheck'и напрямую для отладки ---
    location /health/registry { proxy_pass http://well-registry:8000/health; }
    location /health/telemetry { proxy_pass http://telemetry:8000/health; }
    location /health/ml        { proxy_pass http://ml-diagnostics:8000/health; }
    location /health/alert     { proxy_pass http://alert:8000/health; }
}